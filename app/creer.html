<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Créer une annonce · Kopain</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="kopain.css">
<script src="kopain.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#9DB8FF}
</style>
</helmet>
<div style="width: 430px; height: 884px; box-sizing: border-box; padding: 20px; background: #23262E; position: relative">
<div aria-hidden="true" style="position: absolute; left: 160px; top: 31px; width: 110px; height: 30px; border-radius: 15px; background: #000000; z-index: 5"></div>
<div style="width: 390px; height: 844px; border-radius: 44px; box-sizing: border-box; background: #0B0D12; color: #FFFFFF; font-family: 'Archivo', sans-serif; display: flex; flex-direction: column; padding: 50px 16px 28px; gap: 16px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="accueil.html" aria-label="Retour" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div role="img" aria-label="Étape 1 sur 3" style="display: flex; gap: 4px">
      <span style="width: 40px; height: 4px; border-radius: 2px; background: #FFFFFF"></span>
      <span style="width: 40px; height: 4px; border-radius: 2px; background: #2A2F3C"></span>
      <span style="width: 40px; height: 4px; border-radius: 2px; background: #2A2F3C"></span>
    </div>
    <span style="width: 44px; font-size: 12px; font-weight: 700; color: #A3A9B8; text-align: right">1 / 3</span>
  </div>

  <header style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.01em">Que proposes-tu ?</h1>
    <span style="font-size: 15px; color: #A3A9B8">Trois étapes : quoi, quand, où. Environ 20 secondes.</span>
  </header>

  <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="3">
    <button onClick="{{ t.pick }}" aria-pressed="{{ t.on }}" style="text-align: left; min-height: 92px; padding: 14px; border-radius: 12px; border: 2px solid {{ t.border }}; background: #151821; color: #FFFFFF; font-family: 'Archivo', sans-serif; display: flex; align-items: center; gap: 14px; cursor: pointer">
      <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid {{ t.ring }}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-sizing: border-box"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{ t.dot }}"></span></span>
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 17px; font-weight: 800">{{ t.title }}</span>
        <span style="font-size: 14px; line-height: 1.35; color: #A3A9B8">{{ t.text }}</span>
      </span>
    </button>
  </sc-for>

  <button style="min-height: 60px; padding: 0 14px; border-radius: 12px; border: 1px dashed #3A4152; background: transparent; color: #FFFFFF; font-family: 'Archivo', sans-serif; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
    <span style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; font-weight: 700">Scanner une affiche ou un calendrier</span>
      <span style="font-size: 13px; color: #A3A9B8">Les matchs sont créés automatiquement</span>
    </span>
  </button>

  <a href="jouer.html" style="margin-top: auto; min-height: 54px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Continuer</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2558E6","options":["#2558E6","#D91F26","#0B7A53","#7C3AED"]},"$preview":{"width":430,"height":884}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'joueur' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2558E6';
    const sel = this.state.sel;
    const tiles = [
      { id: 'joueur', title: 'Il me manque un joueur', text: 'Les joueurs du bon niveau autour de toi sont prévenus.' },
      { id: 'partenaire', title: 'Je cherche un partenaire', text: 'Footing, vélo, renforcement : propose ton créneau.' },
      { id: 'match', title: 'J’annonce un match ou un tournoi', text: 'Visible sur la carte, avec score en direct et pronos.' },
      { id: 'club', title: 'Je crée ou gère une page club', text: 'Licencié, loisir ou supporter : chacun peut l’administrer.' }
    ].map((t) => {
      const on = sel === t.id;
      return {
        title: t.title,
        text: t.text,
        on: on,
        border: on ? '#FFFFFF' : '#2A2F3C',
        ring: on ? '#FFFFFF' : '#A3A9B8',
        dot: on ? '#FFFFFF' : 'transparent',
        pick: () => this.setState({ sel: t.id })
      };
    });
    return { accent: accent, tiles: tiles };
  }
}
</script>
</body>
</html>
