<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vote du spectateur sans compte · Kopain</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="kopain.css">
<script src="kopain.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#9DB8FF}
</style>
</helmet>
<div style="width: 430px; height: 884px; box-sizing: border-box; padding: 20px; background: #23262E; position: relative">
<div aria-hidden="true" style="position: absolute; left: 160px; top: 31px; width: 110px; height: 30px; border-radius: 15px; background: #000000; z-index: 5"></div>
<div style="width: 390px; height: 844px; border-radius: 44px; box-sizing: border-box; background: #0B0D12; color: #FFFFFF; font-family: 'Archivo', sans-serif; display: flex; flex-direction: column; padding: 54px 16px 28px; gap: 14px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 4px; margin: -4px 0 -4px -10px">
  <a href="match.html" aria-label="Retour" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
  <div style="flex: 1; min-height: 36px; padding: 0 14px; border-radius: 18px; background: #1D212C; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: #A3A9B8">
    <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    kopain.app/vote
  </div>
  </div>

  <header style="display: flex; flex-direction: column; gap: 6px; padding-top: 6px">
    <span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #A3A9B8">Batignolles 78 – 71 Monceau · vote ouvert 12 min</span>
    <h1 style="margin: 0; font-size: 30px; font-weight: 900; line-height: 1.05; letter-spacing: -.02em">Qui est le joueur du match ?</h1>
    <span style="font-size: 14px; color: #A3A9B8">Sans compte, sans inscription. Un vote par téléphone.</span>
  </header>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{ players }}" as="p" hint-placeholder-count="4">
      <button onClick="{{ p.pick }}" aria-pressed="{{ p.on }}" style="position: relative; min-height: 64px; padding: 0 14px; border-radius: 12px; border: 2px solid {{ p.border }}; background: #151821; color: #FFFFFF; font-family: 'Archivo', sans-serif; display: flex; align-items: center; gap: 12px; text-align: left; overflow: hidden; cursor: pointer">
        <span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{ p.bar }}; background: #1F2937"></span>
        <span style="position: relative; width: 34px; font-size: 26px; font-weight: 900; font-stretch: 75%; color: #A3A9B8">{{ p.num }}</span>
        <span style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 800">{{ p.name }}</span><span style="font-size: 13px; color: #A3A9B8">{{ p.line }}</span></span>
        <span style="position: relative; font-size: 18px; font-weight: 800; font-stretch: 75%; font-variant-numeric: tabular-nums; color: {{ p.pctColor }}">{{ p.pct }}</span>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <sc-if value="{{ voted }}" hint-placeholder-val="{{ false }}">
      <div style="padding: 12px 14px; border-radius: 12px; background: #151821; border: 1px solid #2A2F3C; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 800">Vote enregistré · 86 votants</span>
        <span style="font-size: 13px; color: #A3A9B8">Résultat dans 12 min. Suis le club pour le recevoir.</span>
      </div>
    </sc-if>
    <button onClick="{{ vote }}" style="min-height: 58px; border-radius: 12px; border: none; background: {{ mainBg }}; color: {{ mainColor }}; font: 900 17px 'Archivo', sans-serif; cursor: pointer">{{ mainLabel }}</button>
    <span style="font-size: 13px; color: #A3A9B8; text-align: center">QR code affiché au gymnase et à la buvette</span>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2558E6","options":["#2558E6","#D91F26","#0B7A53","#7C3AED"]},"$preview":{"width":430,"height":884}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: -1, voted: false };
  }
  renderVals() {
    const s = this.state;
    const players = [
      { num: '11', name: 'K. Diallo', line: '24 pts · 7 rebonds', pct: 48 },
      { num: '7', name: 'N. Pinaud', line: '18 pts · 5 passes', pct: 27 },
      { num: '4', name: 'S. Benali', line: '12 pts · 9 rebonds', pct: 15 },
      { num: '23', name: 'M. Rey', line: '15 pts · Monceau', pct: 10 }
    ].map((p, i) => ({
      num: p.num,
      name: p.name,
      line: p.line,
      on: s.pick === i,
      border: s.pick === i ? '#F5B83D' : '#2A2F3C',
      bar: s.voted ? p.pct + '%' : '0%',
      pct: s.voted ? p.pct + ' %' : '',
      pctColor: s.pick === i ? '#F5B83D' : '#FFFFFF',
      pick: () => { if (!s.voted) this.setState({ pick: i }); }
    }));
    const ready = s.pick >= 0;
    return {
      accent: this.props.accent ?? '#2558E6',
      players: players,
      voted: s.voted,
      mainLabel: s.voted ? 'Suivre Batignolles BC' : (ready ? 'Valider mon vote' : 'Choisis un joueur'),
      mainBg: ready ? '#F5B83D' : '#1D212C',
      mainColor: ready ? '#0B0D12' : '#A3A9B8',
      vote: () => { if (ready) this.setState({ voted: true }); }
    };
  }
}
</script>
</body>
</html>
